<title>FogShips.io</title>

* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#1a2830; }
canvas { display:block; position:fixed; top:0; left:0; }

#hud {
  position:fixed; top:0; left:0; right:0;
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:14px 14px 0; z-index:5; pointer-events:none;
}
.pill {
  background:rgba(8,18,26,0.72);
  border:1px solid rgba(200,180,100,0.18);
  border-radius:20px; padding:6px 14px;
  color:#c8aa58; font:13px/1.4 Georgia,serif;
  backdrop-filter:blur(4px);
}
.pill span { font-size:17px; font-weight:bold; color:#e8c870; }

/* Fuel bar — the ONE bar, dominant */
#fuelWrap {
  position:fixed; bottom:110px; left:50%; transform:translateX(-50%);
  width:min(240px,68vw); z-index:5; pointer-events:none;
}
#fuelLabel {
  display:flex; justify-content:space-between;
  color:rgba(200,170,80,0.7); font:10px Georgia,serif;
  letter-spacing:1px; text-transform:uppercase; margin-bottom:4px;
}
